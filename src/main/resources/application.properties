# ═══════════════════════════════════════════════
#  BALAJI PHOTO FRAMES — application.properties
# ═══════════════════════════════════════════════

spring.application.name=balaji-frames
server.port=8085

# ── Active Profile ──────────────────────────────
spring.profiles.active=dev

# ── Thymeleaf ───────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── File Upload ─────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ── Razorpay ────────────────────────────────────
razorpay.key.id=rzp_test_placeholder
razorpay.key.secret=placeholder

# ── Business Info ───────────────────────────────
app.business.upi=8765673141@apl
app.business.phone=8299576949
app.business.name=BALAJI Photo Frames
app.business.address=Rajpur, Shamshabad Road, Agra 282001

# ── Admin Credentials ───────────────────────────
app.admin.username=balaji_admin
app.admin.password=Balaji@2024#Secure

# ── Logging ─────────────────────────────────────
logging.level.com.balaji=DEBUG
logging.level.org.springframework.security=DEBUG

# ── H2 Database ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:balajidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ── H2 Console ──────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ── Disable Browser Frame Blocking ──────────────
server.servlet.session.cookie.same-site=lax

# ── Static Resources ────────────────────────────
spring.web.resources.add-mappings=true
